<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ghost pipeline detection schematic showing close-date movement, stage aging, and stale opportunity flags across a weekly executive operating cadence.">
  <defs>
    <pattern id="grid-bg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3a312a" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    <pattern id="grid-bg-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#2a241f" stroke-width="0.3" opacity="0.7"/>
    </pattern>
    <linearGradient id="paper-grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0c0907"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#paper-grad)"/>
  <rect width="1600" height="900" fill="url(#grid-bg-fine)"/>
  <rect width="1600" height="900" fill="url(#grid-bg)"/>

  <!-- Plate title bar -->
  <g font-family="ui-monospace, SF Mono, Consolas, monospace" fill="#b7aa7a">
    <text x="60" y="62" font-size="14" letter-spacing="6">PLATE</text>
    <text x="60" y="88" font-size="11" letter-spacing="4" fill="#f4ead5" opacity="0.75">GHOST PIPELINE DETECTOR · MOV-12-2026</text>
    <text x="1540" y="62" font-size="14" letter-spacing="6" text-anchor="end">FIG. 50</text>
    <text x="1540" y="88" font-size="11" letter-spacing="4" text-anchor="end" fill="#f4ead5" opacity="0.55">WEEKLY EXECUTIVE OPERATING CADENCE</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="112" x2="1540" y2="112" stroke="#b7aa7a" stroke-width="0.8" opacity="0.6"/>

  <!-- Stages bar -->
  <g font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="10" letter-spacing="2" fill="#f4ead5">
    <text x="60" y="152" opacity="0.55">STAGES</text>
    <g transform="translate(60,170)">
      <rect x="0" y="0" width="200" height="40" fill="none" stroke="#b7aa7a" stroke-width="1"/>
      <text x="100" y="25" text-anchor="middle" font-size="11" letter-spacing="3" fill="#f4ead5" opacity="0.9">DISCOVERY</text>
      <rect x="220" y="0" width="220" height="40" fill="none" stroke="#b7aa7a" stroke-width="1"/>
      <text x="330" y="25" text-anchor="middle" font-size="11" letter-spacing="3" fill="#f4ead5" opacity="0.9">QUALIFIED</text>
      <rect x="460" y="0" width="240" height="40" fill="none" stroke="#b7aa7a" stroke-width="1"/>
      <text x="580" y="25" text-anchor="middle" font-size="11" letter-spacing="3" fill="#f4ead5" opacity="0.9">PROPOSAL</text>
      <rect x="720" y="0" width="240" height="40" fill="none" stroke="#b7aa7a" stroke-width="1"/>
      <text x="840" y="25" text-anchor="middle" font-size="11" letter-spacing="3" fill="#f4ead5" opacity="0.9">NEGOTIATION</text>
      <rect x="980" y="0" width="220" height="40" fill="none" stroke="#b7aa7a" stroke-width="1"/>
      <text x="1090" y="25" text-anchor="middle" font-size="11" letter-spacing="3" fill="#f4ead5" opacity="0.9">VERBAL</text>
      <rect x="1220" y="0" width="260" height="40" fill="#b7aa7a" fill-opacity="0.15" stroke="#b7aa7a" stroke-width="1.5"/>
      <text x="1350" y="25" text-anchor="middle" font-size="11" letter-spacing="3" fill="#f4ead5">CLOSED WON</text>
    </g>
  </g>

  <!-- Close-date movement rows -->
  <g font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#f4ead5">
    <text x="60" y="260" opacity="0.55">CLOSE-DATE MOVEMENT · 12-WEEK ROLLING</text>

    <!-- Row 1: clean deal -->
    <g transform="translate(60,280)">
      <text x="0" y="14" opacity="0.7">OPP-4471</text>
      <text x="110" y="14" opacity="0.4">CARRIER ROLLUP</text>
      <line x1="320" y1="10" x2="1420" y2="10" stroke="#f4ead5" stroke-width="0.4" opacity="0.18"/>
      <line x1="520" y1="0" x2="520" y2="20" stroke="#f4ead5" stroke-width="0.6" opacity="0.4"/>
      <line x1="780" y1="0" x2="780" y2="20" stroke="#f4ead5" stroke-width="0.6" opacity="0.4"/>
      <line x1="1040" y1="0" x2="1040" y2="20" stroke="#f4ead5" stroke-width="0.6" opacity="0.4"/>
      <rect x="520" y="6" width="520" height="8" fill="#b5c7b0" opacity="0.6"/>
      <text x="1180" y="14" opacity="0.55">ON TRACK · CLOSE OCT 14</text>
    </g>

    <!-- Row 2: pushed -->
    <g transform="translate(60,310)">
      <text x="0" y="14" opacity="0.7">OPP-4503</text>
      <text x="110" y="14" opacity="0.4">REGULATED SVCS</text>
      <line x1="320" y1="10" x2="1420" y2="10" stroke="#f4ead5" stroke-width="0.4" opacity="0.18"/>
      <rect x="520" y="6" width="380" height="8" fill="#f4ead5" opacity="0.25"/>
      <rect x="900" y="6" width="240" height="8" fill="#b7aa7a" opacity="0.8"/>
      <path d="M895 5 L905 10 L895 15" fill="none" stroke="#b7aa7a" stroke-width="1.2"/>
      <text x="1180" y="14" opacity="0.7" fill="#b7aa7a">PUSHED 21d · INVESTIGATE</text>
    </g>

    <!-- Row 3: stale -->
    <g transform="translate(60,340)">
      <text x="0" y="14" opacity="0.7">OPP-4318</text>
      <text x="110" y="14" opacity="0.4">SAAS UPSELL</text>
      <line x1="320" y1="10" x2="1420" y2="10" stroke="#f4ead5" stroke-width="0.4" opacity="0.18"/>
      <rect x="520" y="6" width="420" height="8" fill="#f4ead5" opacity="0.18"/>
      <g stroke="#b7aa7a" stroke-width="1.2" stroke-dasharray="3 4" fill="none">
        <line x1="940" y1="10" x2="1340" y2="10"/>
      </g>
      <text x="1180" y="14" opacity="0.7" fill="#b7aa7a">STALE 47d · GHOST</text>
    </g>

    <!-- Row 4: clean again -->
    <g transform="translate(60,370)">
      <text x="0" y="14" opacity="0.7">OPP-4612</text>
      <text x="110" y="14" opacity="0.4">PLATFORM EXPAND</text>
      <line x1="320" y1="10" x2="1420" y2="10" stroke="#f4ead5" stroke-width="0.4" opacity="0.18"/>
      <rect x="520" y="6" width="460" height="8" fill="#b5c7b0" opacity="0.7"/>
      <text x="1180" y="14" opacity="0.55">PULLED 5d · ACCELERATE</text>
    </g>

    <!-- Row 5: split -->
    <g transform="translate(60,400)">
      <text x="0" y="14" opacity="0.7">OPP-4598</text>
      <text x="110" y="14" opacity="0.4">CROSS-SELL</text>
      <line x1="320" y1="10" x2="1420" y2="10" stroke="#f4ead5" stroke-width="0.4" opacity="0.18"/>
      <rect x="520" y="6" width="200" height="8" fill="#f4ead5" opacity="0.32"/>
      <rect x="720" y="6" width="180" height="8" fill="#b7aa7a" opacity="0.55"/>
      <text x="1180" y="14" opacity="0.55">SPLIT · 2 OPPS</text>
    </g>
  </g>

  <!-- Histogram: stage aging -->
  <g font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#f4ead5">
    <text x="60" y="470" opacity="0.55">STAGE AGING · WHISKER</text>
    <g transform="translate(60,490)">
      <line x1="0" y1="40" x2="1480" y2="40" stroke="#f4ead5" stroke-width="0.4" opacity="0.3"/>

      <!-- discovery -->
      <g transform="translate(40,0)">
        <line x1="0" y1="40" x2="0" y2="58" stroke="#f4ead5" opacity="0.5"/>
        <rect x="-22" y="18" width="44" height="44" fill="#b5c7b0" opacity="0.55"/>
        <text x="0" y="84" text-anchor="middle" opacity="0.5">8d</text>
      </g>
      <g transform="translate(280,0)">
        <line x1="0" y1="40" x2="0" y2="58" stroke="#f4ead5" opacity="0.5"/>
        <rect x="-22" y="6" width="44" height="56" fill="#b5c7b0" opacity="0.55"/>
        <text x="0" y="84" text-anchor="middle" opacity="0.5">14d</text>
      </g>
      <g transform="translate(560,0)">
        <line x1="0" y1="40" x2="0" y2="58" stroke="#f4ead5" opacity="0.5"/>
        <rect x="-22" y="-8" width="44" height="72" fill="#b7aa7a" opacity="0.65"/>
        <text x="0" y="84" text-anchor="middle" opacity="0.6">28d</text>
      </g>
      <g transform="translate(840,0)">
        <line x1="0" y1="40" x2="0" y2="58" stroke="#f4ead5" opacity="0.5"/>
        <rect x="-22" y="-26" width="44" height="92" fill="#b7aa7a" opacity="0.85"/>
        <text x="0" y="84" text-anchor="middle" opacity="0.85">41d</text>
      </g>
      <g transform="translate(1100,0)">
        <line x1="0" y1="40" x2="0" y2="58" stroke="#f4ead5" opacity="0.5"/>
        <rect x="-22" y="2" width="44" height="60" fill="#b5c7b0" opacity="0.55"/>
        <text x="0" y="84" text-anchor="middle" opacity="0.5">19d</text>
      </g>
      <g transform="translate(1380,0)">
        <line x1="0" y1="40" x2="0" y2="58" stroke="#f4ead5" opacity="0.5"/>
        <rect x="-22" y="20" width="44" height="32" fill="#b5c7b0" opacity="0.5"/>
        <text x="0" y="84" text-anchor="middle" opacity="0.45">6d</text>
      </g>

      <!-- baseline labels -->
      <text x="40" y="100" text-anchor="middle" opacity="0.4">DISC</text>
      <text x="280" y="100" text-anchor="middle" opacity="0.4">QUAL</text>
      <text x="560" y="100" text-anchor="middle" opacity="0.4">PROP</text>
      <text x="840" y="100" text-anchor="middle" opacity="0.4">NEGO</text>
      <text x="1100" y="100" text-anchor="middle" opacity="0.4">VERBAL</text>
      <text x="1380" y="100" text-anchor="middle" opacity="0.4">WON</text>
    </g>
  </g>

  <!-- Legend + callouts row -->
  <g font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#f4ead5">
    <text x="60" y="720" opacity="0.55">LEGEND</text>
    <g transform="translate(60,738)">
      <rect x="0" y="0" width="22" height="10" fill="#b5c7b0" opacity="0.7"/>
      <text x="32" y="9" opacity="0.7">WITHIN SLA</text>
      <rect x="180" y="0" width="22" height="10" fill="#b7aa7a" opacity="0.8"/>
      <text x="212" y="9" opacity="0.7">MOVEMENT · PUSHED OR PULLED</text>
      <g transform="translate(520,0)" stroke="#b7aa7a" stroke-width="1.2" stroke-dasharray="3 4" fill="none">
        <line x1="0" y1="5" x2="22" y2="5"/>
      </g>
      <text x="552" y="9" opacity="0.7">GHOST · NO ACTIVITY 30D+</text>
      <rect x="860" y="0" width="22" height="10" fill="#f4ead5" opacity="0.25"/>
      <text x="892" y="9" opacity="0.7">PRIOR FORECAST WINDOW</text>
    </g>
  </g>

  <!-- Cadence ribbon -->
  <g font-family="ui-monospace, SF Mono, Consolas, monospace" font-size="10" letter-spacing="2" fill="#f4ead5">
    <text x="60" y="800" opacity="0.55">OPERATING CADENCE</text>
    <g transform="translate(60,818)">
      <rect x="0" y="0" width="1480" height="42" fill="none" stroke="#b7aa7a" opacity="0.45"/>
      <text x="20" y="26" opacity="0.8">MON</text>
      <text x="80" y="26" opacity="0.5">RUN PIPELINE PACKAGE</text>
      <line x1="340" y1="6" x2="340" y2="36" stroke="#b7aa7a" opacity="0.35"/>
      <text x="360" y="26" opacity="0.8">TUE</text>
      <text x="420" y="26" opacity="0.5">FORECAST CALL WITH SALES</text>
      <line x1="720" y1="6" x2="720" y2="36" stroke="#b7aa7a" opacity="0.35"/>
      <text x="740" y="26" opacity="0.8">THU</text>
      <text x="800" y="26" opacity="0.5">CMO + CRO REVIEW</text>
      <line x1="1060" y1="6" x2="1060" y2="36" stroke="#b7aa7a" opacity="0.35"/>
      <text x="1080" y="26" opacity="0.8">FRI</text>
      <text x="1140" y="26" opacity="0.5">PUBLISH TO PE SPONSOR</text>
    </g>
  </g>

  <!-- Plate footer -->
  <line x1="60" y1="880" x2="1540" y2="880" stroke="#b7aa7a" stroke-width="0.8" opacity="0.6"/>
</svg>
